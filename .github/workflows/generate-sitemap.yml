name: Generate Sitemap

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate sitemap.xml
        run: |
          python3 << 'EOF'
          import os, re, subprocess, datetime

          SITE_URL = "https://ibitbetter.space"
          # 输出路径需与 GitHub Pages 发布目录一致（你之前已验证 /sitemap.xml 可访问，保持 static/ 即可）
          OUTPUT = "static/sitemap.xml"

          # ---- 排除规则：薄内容 / 验证页 / 分页 / 标签，避免浪费抓取预算 ----
          # 根目录需跳过的文件（首页已手动添加；隐私/条款/GSC 验证页不收录）
          SKIP_ROOT_FILES = {
              "index.html",
              "privacy.html",
              "terms.html",
              "google475e77f4cf90814b.html",  # GSC 验证页：保留可访问，但排除出 sitemap
          }
          # 路径级正则排除（relpath 相对于 docs/，例如 "tags/fun-sites.html"）
          EXCLUDE_RE = re.compile(r"""
              ^baidu_verify.*\.html$   # ① 百度验证页（已失效→建议直接 git rm 删文件）
              |^page\d+\.html$         # ② 分页 page2..pageN（薄内容）
              |^tag\.html$             # ③ 标签汇总页
              |^tags/                  # ④ 标签详情页
              |^now\.html$             # ⑤ 归档 / now 页（薄内容）
              |^404\.html$             # 错误页
              |^search\.html$          # 搜索页
              |sitemap                # sitemap 自身
          """, re.VERBOSE)

          def get_lastmod(filepath):
              try:
                  result = subprocess.run(
                      ["git", "log", "-1", "--format=%ci", "--", filepath],
                      capture_output=True, text=True
                  )
                  if result.stdout.strip():
                      return result.stdout.strip()[:10]
              except:
                  pass
              return datetime.date.today().isoformat()

          def get_priority(url_path):
              if url_path == "/":
                  return "1.0"
              if "/post/" in url_path:
                  return "0.8"
              return "0.5"

          def get_changefreq(url_path):
              if url_path == "/":
                  return "daily"
              if "/post/" in url_path:
                  return "weekly"
              return "monthly"

          urls = []

          # 首页（手动添加）
          urls.append({
              "loc": SITE_URL + "/",
              "lastmod": get_lastmod("docs/index.html") if os.path.exists("docs/index.html") else "",
              "changefreq": "daily",
              "priority": "1.0"
          })

          # 扫描 docs 下的所有 HTML 文件
          if os.path.exists("docs"):
              for root, dirs, files in os.walk("docs"):
                  # 跳过隐藏目录和 node_modules
                  dirs[:] = [d for d in dirs if not d.startswith(".") and d not in ("node_modules",)]
                  for fname in files:
                      if not fname.endswith(".html"):
                          continue

                      # 根目录跳过列表（首页已手动加，隐私/条款/验证页不收录）
                      if root == "docs" and fname in SKIP_ROOT_FILES:
                          continue

                      fpath = os.path.join(root, fname)

                      # 计算相对于 docs 的路径（URL 中不带 /docs/）
                      relpath = os.path.relpath(fpath, "docs").replace("\\", "/")

                      # 应用排除规则
                      if EXCLUDE_RE.search(relpath):
                          continue
                      if "sitemap" in fname.lower():
                          continue

                      url_path = "/" + relpath
                      full_url = SITE_URL + url_path
                      lastmod = get_lastmod(fpath)
                      urls.append({
                          "loc": full_url,
                          "lastmod": lastmod,
                          "changefreq": get_changefreq(url_path),
                          "priority": get_priority(url_path)
                      })

          # 写 sitemap.xml
          with open(OUTPUT, "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n')
              f.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')
              for u in urls:
                  f.write("  <url>\n")
                  f.write(f"    <loc>{u['loc']}</loc>\n")
                  if u['lastmod']:
                      f.write(f"    <lastmod>{u['lastmod']}</lastmod>\n")
                  f.write(f"    <changefreq>{u['changefreq']}</changefreq>\n")
                  f.write(f"    <priority>{u['priority']}</priority>\n")
                  f.write("  </url>\n")
              f.write('</urlset>\n')

          print(f"sitemap.xml 生成完成，共 {len(urls)} 个 URL")
          EOF

      - name: Commit and push sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/sitemap.xml
          git diff --cached --quiet || git commit -m "🎉chore: auto-generate sitemap.xml [skip ci]"
          git push
