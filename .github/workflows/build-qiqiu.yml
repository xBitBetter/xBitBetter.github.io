name: Build 奇趣网站收藏家

# 触发方式：
#   1) 在「收藏家 Issue」下新增/编辑「站长本人」的评论 → 自动重新生成
#   2) 创建/编辑该 Issue 正文 → 自动重新生成
#   3) 推送 main 分支 → 自动重新生成（便于改配置 / 恢复页面）
#   4) 每天 UTC 0 点定时重新生成（兜底，防止漏触发）
#   5) 在 Actions 页面手动 "Run workflow"
# 重要：仅收录 OWNER（站长本人）本人发布的评论，其它任何人的评论都不会进入页面。
on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 只处理「收藏家 Issue」；其它 issue 的评论/编辑直接跳过，避免无效运行。
# 注意：env 上下文不能在 job 级 if 中使用，只能在 step 级使用，
#       因此 Issue 编号 / 评论作者判定放在下方的 guard 步骤里。
env:
  ISSUE_NUMBER: '185'
  OUTPUT_PATH: 'static/curious-websites.html'
  PAGE_TITLE: '奇趣网站收藏家'
  SITE_TITLE: 'iBitBetter'
  SITE_URL: 'https://ibitbetter.space'
  OWNER: 'iBitBetter'

permissions:
  contents: write
  issues: read

jobs:
  build:
    # job 级 if 只能引用 github / needs / vars / secrets 等上下文，不能引用 env。
    # 这里只按事件类型放行，具体的 Issue 编号 / 评论作者判定交给 guard 步骤（step 级可用 env）。
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # 仅当属于「收藏家 Issue」且（评论事件时）评论作者是站长本人，才继续。
      # env 上下文只能在 step 级使用；schedule / workflow_dispatch / push 没有 issue 对象，被前面短路跳过判断。
      - name: 校验是否收藏家 Issue（且评论须为站长本人）
        id: guard
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' ||
          (github.event_name == 'issue_comment' && github.event.issue.number == env.ISSUE_NUMBER && github.event.comment.user.login == env.OWNER) ||
          (github.event_name == 'issues' && github.event.issue.number == env.ISSUE_NUMBER)
        run: echo 'matched=true' >> "$GITHUB_OUTPUT"

      - name: 生成页面（仅收录站长本人评论）
        if: steps.guard.outputs.matched == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: ${{ env.OUTPUT_PATH }}
          PAGE_TITLE: ${{ env.PAGE_TITLE }}
          SITE_TITLE: ${{ env.SITE_TITLE }}
          SITE_URL: ${{ env.SITE_URL }}
          OWNER: ${{ env.OWNER }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json body -q .body > /tmp/qiqiu_body.md
          # 仅保留 OWNER 本人发布的评论，其它人的评论一律丢弃
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --jq '.[] | select(.user.login == "'"$OWNER"'") | .body' > /tmp/qiqiu_comments.md
          cat /tmp/qiqiu_body.md /tmp/qiqiu_comments.md > combined.md
          node scripts/generate-qiqiu.mjs --local combined.md
          # 修正 canonical 为线上访问路径（生成器按 outputPath 拼接会带上 docs/ 前缀）
          sed -i 's#/docs/curious-websites.html#/curious-websites.html#g' "$OUTPUT_PATH"

      - name: Commit & push
        if: steps.guard.outputs.matched == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_PATH"
          if git diff --cached --quiet; then
            echo '没有变化，跳过提交'
          else
            git commit -m "chore: 更新奇趣网站收藏家（issue #$ISSUE_NUMBER）"
            git pull --rebase origin main
            git push
          fi
