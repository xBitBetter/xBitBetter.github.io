name: Build 奇趣网站收藏家

# 触发方式：
#   1) 在「收藏家 Issue」下新增 / 编辑评论 → 自动重新生成
#   2) 创建 / 编辑该 Issue 正文 → 自动重新生成
#   3) 每天 UTC 0 点定时重新生成（兜底，防止漏触发）
#   4) 在 Actions 页面手动 "Run workflow"
on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# 只处理「收藏家 Issue」；其它 issue 的评论/编辑直接跳过，避免无效运行。
env:
  ISSUE_NUMBER: "1"                    # ← 改成你的「奇趣网站收藏家」Issue 编号
  OUTPUT_PATH: "curious-websites.html" # ← 生成的页面文件名（与站点同域，访问 /curious-websites.html）
  PAGE_TITLE: "奇趣网站收藏家"           # ← 页面大标题
  SITE_TITLE: "iBitBetter"             # ← 副标题里显示的小站名
  SITE_URL: "https://ibitbetter.space" # ← 站点地址（用于导航/规范链接/canonical）

permissions:
  contents: write   # 提交生成的 curious-websites.html
  issues: read      # 读取 issue 正文与评论

jobs:
  build:
    # issue_comment / issues 事件下，仅当操作对象属于配置的资源 Issue 才执行
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.issue.number == env.ISSUE_NUMBER }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate 奇趣网站收藏家 page
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: ${{ env.OUTPUT_PATH }}
          PAGE_TITLE: ${{ env.PAGE_TITLE }}
          SITE_TITLE: ${{ env.SITE_TITLE }}
          SITE_URL: ${{ env.SITE_URL }}
        run: node scripts/generate-qiqiu.mjs

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新奇趣网站收藏家（issue #$ISSUE_NUMBER）"
            git push
          fi
