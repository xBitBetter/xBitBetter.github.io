name: Build 奇趣网站收藏家

# 触发方式：
#   1) 在「收藏家 Issue」下新增 / 编辑评论 → 自动重新生成
#   2) 创建 / 编辑该 Issue 正文 → 自动重新生成
#   3) 每天 UTC 0 点定时重新生成（兜底，防止漏触发）
#   4) 在 Actions 页面手动 "Run workflow"
on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# 只处理「收藏家 Issue」；其它 issue 的评论/编辑直接跳过，避免无效运行。
# 注意：env 上下文不能在 job 级 if 中使用，只能在 step 级使用，
#       因此 Issue 编号判定放在下方的 guard 步骤里。
env:
  ISSUE_NUMBER: "185"                    # ← 改成你的「奇趣网站收藏家」Issue 编号
  OUTPUT_PATH: "docs/curious-websites.html" # ← 生成的页面文件名（与站点同域，访问 /curious-websites.html）
  PAGE_TITLE: "奇趣网站收藏家"           # ← 页面大标题
  SITE_TITLE: "iBitBetter"             # ← 副标题里显示的小站名
  SITE_URL: "https://ibitbetter.space" # ← 站点地址（用于导航/规范链接/canonical）

permissions:
  contents: write   # 提交生成的 curious-websites.html
  issues: read      # 读取 issue 正文与评论

jobs:
  build:
    # job 级 if 只能引用 github / needs / vars / secrets 等上下文，不能引用 env。
    # 这里只按事件类型放行，具体的 Issue 编号判定交给 guard 步骤（step 级可用 env）。
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 仅当属于「收藏家 Issue」时才继续；env 上下文只能在 step 级使用。
      # schedule / workflow_dispatch 事件没有 issue 对象，会被前面的条件短路跳过判断。
      - name: 校验是否收藏家 Issue
        id: guard
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          github.event.issue.number == env.ISSUE_NUMBER
        run: echo "matched=true" >> "$GITHUB_OUTPUT"

      - name: Generate 奇趣网站收藏家 page
        if: steps.guard.outputs.matched == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: ${{ env.OUTPUT_PATH }}
          PAGE_TITLE: ${{ env.PAGE_TITLE }}
          SITE_TITLE: ${{ env.SITE_TITLE }}
          SITE_URL: ${{ env.SITE_URL }}
        run: node scripts/generate-qiqiu.mjs

      - name: Commit & push
        if: steps.guard.outputs.matched == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新奇趣网站收藏家（issue #$ISSUE_NUMBER）"
            git push
          fi
