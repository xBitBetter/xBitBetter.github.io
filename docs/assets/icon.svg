<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="iBitBetter logo">
  <title>iBitBetter</title>
  <!-- 蓝色圆角方块（呼应站点主蓝 #3475e4，圆角 6px 风格） -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#3475e4"/>
  <!-- 三颗逐级上升的白色像素方块：隐喻「一点点、一步步 Better」 -->
  <rect x="15"   y="37"   width="11" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="26.5" y="25.5" width="11" height="11" rx="2.5" fill="#ffffff"/>
  <rect x="38"   y="14"   width="11" height="11" rx="2.5" fill="#ffffff"/>
</svg>
